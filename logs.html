<link rel="stylesheet" href="/admin/assets/admin_theme.css">
<style>

    --warn: #fbbf24;
    --danger: #f87171;
    --debug: #67e8f9;
    --info: #34d399;
    --radius: 10px;

    --text-bright: #0f172a;

    --text-faint: #94a3b8;
    --primary: #2563eb;
    --primary-d: #1d4ed8;
    --ok: #047857;
    --warn: #b45309;

  html[data-theme="light"] .app-nav a.active { background: rgba(37, 99, 235, .1); color: #1d4ed8; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;

  /* ── Layout ── */

<div class="page">
  <header>

      </div>
      <div class="brand-text">

    <div class="spacer"></div>
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn" id="pauseBtn">
          <span id="pauseIcon">⏸</span>
          <span id="pauseText">暂停</span>
        </button>
        <button class="btn btn-danger" id="clearBtn">🗑 清空</button>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-group level-filter" id="levelFilter">
        <label><input type="checkbox" value="DEBUG"><span style="color:var(--debug)">DEBUG</span></label>
        <label><input type="checkbox" value="INFO" checked><span style="color:var(--info)">INFO</span></label>
        <label><input type="checkbox" value="WARNING" checked><span style="color:var(--warn)">WARN</span></label>
        <label><input type="checkbox" value="ERROR" checked><span style="color:var(--danger)">ERROR</span></label>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-group">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索日志内容..." aria-label="搜索日志内容">

  <div class="terminal-wrapper">
    <div class="terminal" id="terminal">
      <div class="virtual-list" id="virtualList"></div>

        <span class="icon">$</span>
        <span>等待日志数据…</span>
        <span style="font-size:12px;color:var(--text-faint)">连接建立后日志会实时滚动显示</span>
      </div>

  <div class="resume-hint" id="resumeHint">
    <span>↓</span> 点击恢复自动滚动
  </div>

<script>
(function() {
  'use strict';

  // ── DOM refs ──
  const terminal = document.getElementById('terminal');
  const virtualList = document.getElementById('virtualList');
  const emptyState = document.getElementById('emptyState');
  const pauseBtn = document.getElementById('pauseBtn');
  const pauseIcon = document.getElementById('pauseIcon');
  const pauseText = document.getElementById('pauseText');
  const clearBtn = document.getElementById('clearBtn');
  const searchInput = document.getElementById('searchInput');
  const lineCountEl = document.getElementById('lineCount');
  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');
  const resumeHint = document.getElementById('resumeHint');
  const levelCheckboxes = document.querySelectorAll('#levelFilter input[type="checkbox"]');

  // ── State ──
  let es = null;
  let streamWatchdog = null;
  let pollTimer = null;
  let isPaused = false;
  let isUserScrolledUp = false;
  let lastSeq = 0;
  let entries = [];
  let filteredIndexes = [];
  let searchTimer = null;
  let renderFrame = null;
  const ROW_HEIGHT = 26;
  const OVERSCAN = 12;
  const LEVELS = { DEBUG: 'debug', INFO: 'info', WARNING: 'warning', ERROR: 'error' };

  // ── Connection status ──
  function setStatus(state) {
    connDot.className = 'status-dot ' + state;
    const texts = {
      connected: '已连接',
      connecting: '连接中...',
      polling: '轮询模式',
      disconnected: '已断开'
    };
    connText.textContent = texts[state] || state;
  }

  // ── Create log line element (efficient, no innerHTML) ──
  function createLogLine(entry, virtualIndex) {
    const line = document.createElement('div');
    line.className = 'log-line';
    line.style.transform = 'translateY(' + (virtualIndex * ROW_HEIGHT) + 'px)';

    const ts = document.createElement('span');
    ts.className = 'log-ts';
    ts.textContent = entry.ts || '';

    const levelClass = LEVELS[entry.level] || 'info';
    const lvl = document.createElement('span');
    lvl.className = 'log-level ' + levelClass;
    lvl.textContent = entry.level;

    const msg = document.createElement('span');
    msg.className = 'log-message';
    msg.textContent = entry.message;
    msg.title = entry.message;

    line.appendChild(ts);
    line.appendChild(lvl);
    line.appendChild(msg);

    return line;
  }

  // ── Virtual list ──
  const pendingBatch = [];
  let batchTimer = null;

  function normalizeEntry(entry) {
    const message = String(entry.message || '');
    return {
      ts: String(entry.ts || ''),
      level: String(entry.level || 'INFO').toUpperCase(),
      message,
      searchText: message.toLowerCase(),
      seq: Number(entry.seq || 0),
    };
  }

  function entryMatches(entry, activeLevels, query) {
    return activeLevels.has(entry.level) && (!query || entry.searchText.includes(query));
  }

  function scheduleRender() {
    if (renderFrame) return;
    renderFrame = requestAnimationFrame(() => {
      renderFrame = null;
      renderVisibleRows();
    });
  }

  function renderVisibleRows() {
    virtualList.style.height = (filteredIndexes.length * ROW_HEIGHT) + 'px';
    emptyState.style.display = filteredIndexes.length ? 'none' : 'flex';
    const start = Math.max(0, Math.floor(terminal.scrollTop / ROW_HEIGHT) - OVERSCAN);
    const count = Math.ceil(terminal.clientHeight / ROW_HEIGHT) + OVERSCAN * 2;
    const end = Math.min(filteredIndexes.length, start + count);
    const frag = document.createDocumentFragment();
    for (let virtualIndex = start; virtualIndex < end; virtualIndex++) {
      const entry = entries[filteredIndexes[virtualIndex]];
      frag.appendChild(createLogLine(entry, virtualIndex));
    }
    virtualList.replaceChildren(frag);
  }

  function updateLineCount() {
    lineCountEl.textContent = entries.length + ' / ' + filteredIndexes.length;
  }

  function flushBatch() {
    if (pendingBatch.length === 0) return;
    const activeLevels = getActiveLevels();
    const query = (searchInput.value || '').trim().toLowerCase();
    for (const rawEntry of pendingBatch) {
      const entry = normalizeEntry(rawEntry);
      const index = entries.push(entry) - 1;
      if (entryMatches(entry, activeLevels, query)) filteredIndexes.push(index);
    }
    pendingBatch.length = 0;
    updateLineCount();
    renderVisibleRows();
    if (!isUserScrolledUp) {
      terminal.scrollTop = terminal.scrollHeight;
      renderVisibleRows();
    }
  }

  function queueEntry(entry) {
    pendingBatch.push(entry);
    if (!batchTimer) {
      batchTimer = requestAnimationFrame(() => {
        batchTimer = null;
        flushBatch();
      });
    }
  }

  function stopTransports() {
    if (es) { try { es.close(); } catch(e) {} es = null; }
    if (streamWatchdog) { clearTimeout(streamWatchdog); streamWatchdog = null; }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function acceptEntry(entry) {
    if (!entry || !entry.seq || entry.seq <= lastSeq) return;
    lastSeq = entry.seq;
    queueEntry(entry);
  }

  async function pollIncremental() {
    if (isPaused) return;
    try {
      const res = await fetch(new URL('/logs/history?since=' + lastSeq, window.location.origin).toString(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const entries = await res.json();
      if (Array.isArray(entries)) entries.forEach(acceptEntry);
      setStatus('polling');
    } catch (e) {
      setStatus('disconnected');
      console.error('Log polling failed:', e);
    }
  }

  function startPolling() {
    stopTransports();
    if (isPaused) return;
    setStatus('polling');
    pollIncremental();
    pollTimer = setInterval(pollIncremental, 2000);
  }

  // ── SSE with polling fallback ──
  function connectStream() {
    stopTransports();
    setStatus('connecting');

    // Pass lastSeq so SSE only sends entries we don't already have
    const url = new URL('/logs/stream' + (lastSeq > 0 ? '?since=' + lastSeq : ''), window.location.origin).toString();
    es = new EventSource(url);
    streamWatchdog = setTimeout(startPolling, 5000);

    es.onopen = () => {
      if (streamWatchdog) { clearTimeout(streamWatchdog); streamWatchdog = null; }
      setStatus('connected');
    };

    es.onmessage = (ev) => {
      if (!ev.data || ev.data.trim() === '') return;
      if (ev.data.startsWith(':')) return; // keepalive comment
      try {
        const entry = JSON.parse(ev.data);
        acceptEntry(entry);
      } catch (e) {
        // If not JSON, treat as plain text
        queueEntry({ ts: new Date().toISOString().replace('T',' ').slice(0,19), level: 'INFO', message: String(ev.data) });
      }
    };

    es.onerror = () => {
      startPolling();
    };
  }

  // ── Load history ──
  async function loadHistory() {
    try {
      setStatus('connecting');
      const res = await fetch(new URL('/logs/history', window.location.origin).toString());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) return;

      for (const entry of data) {
        if (entry.seq && entry.seq > lastSeq) lastSeq = entry.seq;
      }
      entries = data.map(normalizeEntry);
      applyFilters();
      terminal.scrollTop = terminal.scrollHeight;
      renderVisibleRows();
    } catch (e) {
      console.error('Failed to load history:', e);
    }
  }

  // ── Filters ──
  function getActiveLevels() {
    const set = new Set();
    levelCheckboxes.forEach(cb => { if (cb.checked) set.add(cb.value); });
    return set;
  }

  function applyFilters() {
    const activeLevels = getActiveLevels();
    const query = (searchInput.value || '').trim().toLowerCase();
    filteredIndexes = [];
    for (let index = 0; index < entries.length; index++) {
      if (entryMatches(entries[index], activeLevels, query)) filteredIndexes.push(index);
    }
    terminal.scrollTop = 0;
    updateLineCount();
    renderVisibleRows();
  }

  // ── Scroll detection ──
  function checkScroll() {
    const threshold = 40;
    const atBottom = (terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight) < threshold;
    if (atBottom) {
      isUserScrolledUp = false;
      resumeHint.classList.remove('show');
    } else {
      isUserScrolledUp = true;
      resumeHint.classList.add('show');
    }
  }

  terminal.addEventListener('scroll', () => {
    checkScroll();
    scheduleRender();
  }, { passive: true });
  window.addEventListener('resize', scheduleRender);

  // ── Event listeners ──
  pauseBtn.addEventListener('click', () => {
    isPaused = !isPaused;
    if (isPaused) {
      stopTransports();
      setStatus('disconnected');
      pauseIcon.textContent = '▶';
      pauseText.textContent = '继续';
      pauseBtn.classList.add('active');
    } else {
      connectStream();
      pauseIcon.textContent = '⏸';
      pauseText.textContent = '暂停';
      pauseBtn.classList.remove('active');
    }
  });

  clearBtn.addEventListener('click', () => {
    entries = [];
    filteredIndexes = [];
    pendingBatch.length = 0;
    terminal.scrollTop = 0;
    updateLineCount();
    renderVisibleRows();
  });

  searchInput.addEventListener('input', () => {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });

  levelCheckboxes.forEach(cb => {
    cb.addEventListener('change', applyFilters);
  });

  resumeHint.addEventListener('click', () => {
    isUserScrolledUp = false;
    resumeHint.classList.remove('show');
    terminal.scrollTop = terminal.scrollHeight;
    renderVisibleRows();
  });

  // ── Init ──
  async function init() {
    await loadHistory();
    connectStream();
  }

  init();
})();
</script>
<script src="/admin/assets/admin_ui.js" defer></script>
</body>
</html>
