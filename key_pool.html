<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>号池管理 · llm-retry-proxy</title>
  <style>
    :root{
      --bg:#f4f6f8;
      --card:#fff; --card-2:#f8fafc; --border:#e2e7ee; --border-strong:#cbd3df;
      --text:#0f172a; --text-2:#334155; --muted:#6b7280; --muted-2:#9ca3af;
      --primary:#2563eb; --primary-d:#1d4ed8; --primary-l:#eff6ff;
      --ok:#10b981; --ok-l:#ecfdf5; --ok-d:#047857;
      --warn:#f59e0b; --warn-l:#fffbeb; --warn-d:#b45309;
      --danger:#ef4444; --danger-l:#fef2f2; --danger-d:#b91c1c;
      --radius:8px; --radius-sm:8px; --radius-xs:6px;
      --shadow-xs:0 1px 2px rgba(15,23,42,.04);
      --shadow:0 1px 3px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.03);
      --shadow-md:0 4px 12px -2px rgba(15,23,42,.08),0 2px 6px -2px rgba(15,23,42,.04);
      --shadow-lg:0 12px 32px -8px rgba(15,23,42,.12),0 4px 12px -4px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:14px}
    button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}

    header{background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
    header .brand{display:flex;align-items:center;gap:10px;flex:0 0 200px}
    header .logo{width:30px;height:30px;border-radius:7px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;box-shadow:0 2px 6px rgba(37,99,235,.24)}
    header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:0}
    header .sub{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    header .sub .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.15);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    header .spacer{flex:1}
    .app-nav{display:flex;align-items:center;gap:4px;margin-left:12px}
    .app-nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:6px;font-size:13px;font-weight:500;transition:color .15s,background .15s}
    .app-nav a:hover{background:var(--card-2);color:var(--text)}
    .app-nav a.active{background:var(--primary-l);color:var(--primary-d)}
    .header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .interval-control{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
    .interval-control input{width:72px;height:34px;border:1px solid var(--border);border-radius:var(--radius-xs);padding:0 8px;color:var(--text);background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
    .interval-control input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}

    main{width:100%;max-width:1680px;margin:0 auto;padding:24px 28px 56px}

    .btn{min-height:34px;padding:0 13px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--card);color:var(--text-2);font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
    .btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-l);box-shadow:var(--shadow-xs)}
    .btn:active{transform:translateY(1px)}
    .btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn.primary:hover{background:var(--primary-d);border-color:var(--primary-d);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
    .btn.info{background:var(--primary-l);border-color:#bfdbfe;color:var(--primary-d)}
    .btn.info:hover{background:#dbeafe;border-color:#93c5fd;color:var(--primary-d)}
    .btn.success{background:var(--ok-l);border-color:#a7f3d0;color:var(--ok-d)}
    .btn.success:hover{background:#d1fae5;border-color:#6ee7b7;color:var(--ok-d)}
    .btn.warning{background:var(--warn-l);border-color:#fde68a;color:var(--warn-d)}
    .btn.warning:hover{background:#fef3c7;border-color:#fcd34d;color:var(--warn-d)}
    .btn.danger{color:var(--danger-d)}
    .btn.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-l)}

    .notice{display:none;margin-bottom:14px;padding:10px 14px;border-radius:var(--radius-xs);border:1px solid;font-size:13px}
    .notice.show{display:block}
    .notice.ok{color:var(--ok-d);background:var(--ok-l);border-color:#a7f3d0}
    .notice.warn{color:var(--warn-d);background:var(--warn-l);border-color:#fde68a}
    .notice.error{color:var(--danger-d);background:var(--danger-l);border-color:#fecaca}

    .connect{display:none;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;padding:20px;box-shadow:var(--shadow)}
    .connect.open{display:block}
    .connect h2{font-size:13px;margin:0 0 16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:0}
    .connect h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--primary);flex-shrink:0}
    .form-grid{display:grid;grid-template-columns:180px minmax(260px,1fr) 180px 180px;gap:12px}
    .field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px;font-weight:500}
    .field input,.field select{width:100%;height:38px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--card);padding:0 10px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
    .field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .credentials{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px;margin-top:12px}
    .manual-meta{display:grid;grid-template-columns:1fr 2fr 2fr;gap:12px;margin-top:12px}
    .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

    .empty{padding:70px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);font-size:13px}
    .source-list{display:grid;gap:14px}
    .source{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s}
    .source:hover{box-shadow:var(--shadow-md)}
    .source-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
    .source.collapsed .source-head{border-bottom:0}
    .source-toggle{min-width:0;flex:1;display:flex;align-items:center;gap:11px;padding:0;border:0;background:transparent;text-align:left;cursor:pointer}
    .source-toggle:disabled{cursor:default;opacity:1}
    .accordion-icon{position:relative;width:30px;height:30px;flex:0 0 30px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--card-2);color:var(--muted);transition:border-color .15s,background .15s,color .15s}
    .accordion-icon::before{content:"";position:absolute;left:10px;top:8px;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .18s,top .18s}
    .source:not(.collapsed) .accordion-icon::before{top:11px;transform:rotate(225deg)}
    .source-toggle:not(:disabled):hover .accordion-icon{border-color:var(--primary);background:var(--primary-l);color:var(--primary)}
    .source-toggle:focus-visible{outline:2px solid var(--primary);outline-offset:4px;border-radius:var(--radius-xs)}
    .source-list.single .accordion-icon{display:none}
    .source-title{min-width:0}
    .source-title strong{display:block;font-size:15px;font-weight:700;color:var(--text)}
    .source-title span{display:block;color:var(--muted);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .source-glance{display:flex;align-items:center;gap:8px;flex:0 0 auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
    .source-glance strong{color:var(--text-2);font-size:13px}
    .source-actions{margin-left:auto;display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
    .source-actions .btn.danger{background:var(--danger-l);border-color:#fecaca;color:var(--danger-d)}
    .source-actions .btn.danger:hover{background:#fee2e2;border-color:#fca5a5;color:var(--danger-d)}
    .source-policy{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--card-2);flex-wrap:wrap}
    .source-policy [hidden]{display:none!important}
    .strategy-control{display:flex;align-items:center;gap:12px;flex:1 0 100%;min-width:0}
    .strategy-control>label{flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:600}
    .strategy-scroll{min-width:0;overflow-x:auto;scrollbar-width:thin}
    .segmented{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-xs);overflow:hidden;background:var(--card)}
    .segmented button{height:32px;padding:0 12px;border:0;border-right:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer}
    .segmented button:last-child{border-right:0}.segmented button.active{background:var(--primary);color:#fff}
    .target-control{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
    .target-control input{width:72px;height:32px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);padding:0 8px;background:var(--card)}
    .target-control select{height:32px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);padding:0 8px;background:var(--card)}
    .target-control input[type=checkbox]{width:auto;height:auto;padding:0}
    .target-control input.model-input{width:180px}
    .policy-help{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid var(--border-strong);border-radius:50%;color:var(--muted);font-size:11px;font-weight:700;line-height:1;cursor:help}
    .policy-help:hover,.policy-help:focus-visible{border-color:var(--primary);color:var(--primary);outline:none}
    .policy-thresholds{color:var(--text-2);font-size:12px;font-variant-numeric:tabular-nums}

    .pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.02em}
    .pill.ok{background:var(--ok-l);color:var(--ok-d)}
    .pill.muted{background:var(--card-2);color:var(--muted)}
    .pill.warn{background:var(--warn-l);color:var(--warn-d)}

    .source-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
    .metric{background:var(--card);padding:14px 18px}
    .metric label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
    .metric span{font-weight:700;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
    .source-error{color:var(--danger-d);background:var(--danger-l);padding:10px 18px;border-bottom:1px solid #fecaca;font-size:12px}
    .scheduler{border-bottom:1px solid var(--border)}
    .scheduler-head{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;background:var(--card-2);color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .scheduler .table-wrap{max-height:260px}
    .scheduler table{min-width:680px}
    .workload{display:flex;align-items:center;gap:7px}.workload code{font-size:11px;color:var(--text-2)}
    .state-detail{color:var(--muted);font-size:11px;margin-left:5px}

    .table-wrap{overflow:auto;max-height:520px}
    table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
    th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
    th{position:sticky;top:0;background:var(--card-2);color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;z-index:1}
    th .sort-head{border:0;background:transparent;padding:0;color:inherit;font:inherit;cursor:pointer}
    th .sort-head:hover,th .sort-head.active{color:var(--primary)}
    th .sort-icon{margin-left:4px;color:var(--primary)}
    td.num,th.num{text-align:right}
    tbody tr{transition:background .12s}
    tbody tr:hover{background:var(--primary-l)}
    tbody tr:last-child td{border-bottom:0}
    .rules{color:var(--muted);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
    .capabilities{min-width:220px;max-width:360px;white-space:normal;line-height:1.55;overflow-wrap:anywhere}
    .capabilities div+div{margin-top:4px}
    .rejected-model{color:var(--danger-d);text-decoration:line-through;text-decoration-thickness:1.5px}
    .rejected-route{display:inline-block;margin-left:4px;padding:0 4px;border:1px solid var(--danger);color:var(--danger-d);font-size:10px;line-height:16px;vertical-align:1px}
    .cooled{color:var(--warn-d);font-weight:600}.disabled-key{color:var(--muted);background:var(--card-2)}
    .key-actions{display:flex;align-items:center;gap:12px}
    .text-action{padding:0;border:0;background:transparent;color:var(--primary);font-size:12px;line-height:1.5;cursor:pointer}
    .text-action:hover{color:var(--primary-d);text-decoration:underline;text-underline-offset:2px}
    .text-action.danger{color:var(--danger-d)}
    .text-action.danger:hover{color:var(--danger)}
    .rule-input{width:190px;max-width:100%;height:32px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);padding:0 10px;font-size:12px;color:var(--text);background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
    .rule-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .rule-input::placeholder{color:var(--muted-2)}

    .experience-config{flex:0 0 auto;border-bottom:1px solid var(--border);background:var(--card-2)}
    .experience-config>summary{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;cursor:pointer;color:var(--text-2);font-size:12px;font-weight:700;list-style:none}
    .experience-config>summary::-webkit-details-marker{display:none}
    .experience-config>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
    .experience-config[open]>summary::before{transform:rotate(45deg)}
    .experience-config>summary:hover{background:var(--primary-l);color:var(--primary-d)}
    .experience-config>summary span{min-width:0;margin-left:auto;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .experience-config[open]>summary{border-bottom:1px solid var(--border)}
    .experience-config-body{max-height:min(360px,36vh);overflow:auto}
    .experience-section{padding:14px 18px}
    .experience-section+.experience-section{border-top:1px solid var(--border)}
    .experience-section h3,.experience-mapping-head h3{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--text-2)}
    .experience-grid{display:grid;grid-template-columns:1fr;gap:12px}
    .query-param-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
    .query-param-head span{color:var(--muted);font-size:12px;font-weight:500}
    .query-param-list{display:grid;gap:8px;margin-top:8px}
    .query-param-row{display:grid;grid-template-columns:minmax(160px,1fr) minmax(200px,2fr) auto;gap:8px;align-items:center}
    .query-param-row input{width:100%;height:34px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--card);padding:0 10px;color:var(--text);outline:none}
    .query-param-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .transform-grid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px}
    .experience-config-body>.form-actions{margin:0;padding:12px 18px;border-top:1px solid var(--border);background:var(--card)}
    .experience-status{margin-right:auto;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .experience-combobox{position:relative;min-width:320px}
    .experience-select{width:100%;height:34px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--card);padding:0 34px 0 10px;font-size:12px;color:var(--text);text-overflow:ellipsis}
    .experience-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none}
    .experience-select.unresolved{border-color:var(--danger);background:var(--danger-l)}
    .experience-combobox-toggle{position:absolute;right:1px;top:1px;width:32px;height:32px;border:0;border-left:1px solid transparent;border-radius:0 5px 5px 0;background:transparent;color:var(--muted);cursor:pointer}
    .experience-combobox-toggle::before{content:"";position:absolute;left:11px;top:11px;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
    .experience-combobox-toggle:hover,.experience-combobox-toggle:focus-visible{background:var(--card-2);color:var(--primary);outline:none}
    .experience-combobox:focus-within .experience-combobox-toggle{border-left-color:var(--border)}
    .experience-options{position:fixed;z-index:140;max-height:280px;overflow:auto;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--card);box-shadow:var(--shadow-md);padding:4px}
    .experience-option{width:100%;min-height:48px;border:0;border-radius:4px;background:transparent;padding:7px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;text-align:left;color:var(--text-2);cursor:pointer}
    .experience-option:hover,.experience-option.active{background:var(--primary-l)}
    .experience-option strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text)}
    .experience-option.active strong{color:var(--primary-d)}
    .experience-option-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}
    .experience-option-stats{grid-row:1/3;grid-column:2;align-self:center;color:var(--text-2);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .experience-option-empty{padding:18px 12px;text-align:center;color:var(--muted);font-size:12px}
    .experience-mapping-head{padding:12px 18px 0;background:var(--card)}
    .experience-mapping-head h3{margin-bottom:0}
    .experience-dialog{width:min(1180px,100%);height:min(820px,calc(100vh - 48px));max-height:calc(100vh - 48px)}
    .experience-dialog .dialog-head,.experience-dialog .dialog-actions,.experience-mapping-head{flex:0 0 auto}
    .experience-dialog #experienceTable{flex:1 1 auto;min-height:220px}

    #manualEditModal .dialog,#manualAddModal .dialog{width:min(560px,100%)}
    .manual-edit-body{padding:18px}
    .manual-edit-body .form-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .manual-edit-body .field--wide{grid-column:1/-1}

    .modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.42);padding:24px;align-items:center;justify-content:center}
    .modal.open{display:flex}
    .dialog{width:min(980px,100%);max-height:min(760px,calc(100vh - 48px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden}
    .dialog-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
    .dialog-head h2{font-size:15px;margin:0;font-weight:700}
    .dialog-head button{margin-left:auto}
    .group-tools{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--card-2)}
    .group-tools .field{width:min(280px,100%)}
    .group-table{overflow:auto;min-height:220px}
    .group-table table{min-width:620px}
    .group-table input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
    .dialog-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);background:var(--card)}
    .dialog-actions .summary{margin-right:auto;color:var(--muted);font-size:12px}
    .operation-progress{color:var(--primary);font-size:12px;margin-right:auto}
    .dialog-actions .operation-progress+.btn{margin-left:0}

    @media(max-width:1050px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.transform-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:820px){header{padding:10px 16px;gap:8px}.header-actions{width:100%}main{padding:16px 16px 40px}}

<body>
<header>
  <div class="brand">
    <div class="logo">R</div>
    <div>
      <h1>号池管理</h1>
      <span class="sub"><span class="dot"></span>上游号池连接与 Key 管理</span>
    </div>
  </div>
  <nav class="app-nav" aria-label="主导航"><a href="/stats">统计</a><a href="/logs">日志</a><a class="active" href="/key-pools">号池</a><a href="/settings">配置</a></nav>
  <div class="spacer"></div>
  <div class="header-actions">
    <label class="interval-control">同步周期 <input id="syncInterval" type="number" min="0" max="86400" step="1"> 秒</label>
    <button class="btn" id="saveInterval">保存周期</button>
    <button class="btn" id="syncAll">立即同步</button>
    <button class="btn primary" id="addSource">添加上游</button>
    <button class="btn info" id="addManual">手动添加 Key</button>
  </div>
</header>
<main>
  <div class="notice" id="notice"></div>
  <section class="connect" id="connectPanel">
    <h2>添加上游连接</h2>
    <form id="connectForm">
      <div class="form-grid">
        <div class="field"><label for="adapter">适配器</label><select id="adapter" required></select></div>
        <div class="field"><label for="baseUrl">上游地址</label><input id="baseUrl" type="url" required></div>
        <div class="field"><label for="routePrefix">代理前缀</label><input id="routePrefix" placeholder="/example" required></div>
        <div class="field"><label for="provider">Provider</label><input id="provider"></div>
      </div>
      <div class="credentials" id="credentials"></div>
      <div class="form-actions"><button class="btn" type="button" id="cancelConnect">取消</button><button class="btn primary" type="submit" id="connectSubmit">连接并同步</button></div>
    </form>
  </section>
  <section class="connect" id="manualPanel">
    <h2>手动添加 Key</h2>
    <form id="manualForm">
      <div class="form-grid">
        <div class="field"><label for="manualProvider">Provider</label><input id="manualProvider" placeholder="选填"></div>
        <div class="field"><label for="manualUrl">上游地址</label><input id="manualUrl" type="url" required></div>
        <div class="field"><label for="manualPrefix">代理前缀</label><input id="manualPrefix" placeholder="选填，如 /myapi"></div>
        <div class="field"><label for="manualSort">倍率</label><input id="manualSort" placeholder="选填，数字"></div>
      </div>
      <div class="manual-meta">
        <div class="field" style="grid-column:1/-1"><label for="manualKeys">Key 列表</label><textarea id="manualKeys" rows="5" required placeholder="一行一个 Key，支持 key|标识 格式" style="width:100%;min-height:80px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);padding:8px 10px;font:inherit;resize:vertical;outline:none;transition:border-color .15s,box-shadow .15s" onfocus="this.style.borderColor='var(--primary)';this.style.boxShadow='0 0 0 3px rgba(37,99,235,.12)'" onblur="this.style.borderColor='';this.style.boxShadow=''"></textarea></div>
        <div class="field"><label for="manualGroup">分组名</label><input id="manualGroup" placeholder="选填，所有 Key 共享"></div>
        <div class="field"><label for="manualModels">模型规则</label><input id="manualModels" placeholder="选填，分号分隔，如 gpt-4*;claude*"></div>
        <div class="field"><label for="manualPaths">路径规则</label><input id="manualPaths" placeholder="选填，分号分隔，如 v1/images/*;v1/chat/*"></div>
      </div>
      <div class="form-actions"><button class="btn" type="button" id="cancelManual">取消</button><button class="btn primary" type="submit" id="manualSubmit">添加 Key</button></div>
    </form>
  </section>
  <div id="content"><div class="empty">正在载入</div></div>
</main>
<div class="modal" id="groupModal" role="dialog" aria-modal="true" aria-labelledby="groupDialogTitle">
  <section class="dialog">
    <div class="dialog-head"><h2 id="groupDialogTitle">选择分组</h2><button class="btn" id="closeGroups" type="button">关闭</button></div>
    <div class="group-tools">
      <button class="btn" id="selectMissing" type="button">选择缺失分组</button>
      <button class="btn" id="selectAllGroups" type="button">全选</button>
    </div>
    <div class="group-table" id="groupTable"><div class="empty">正在载入</div></div>
    <div class="dialog-actions"><span class="summary" id="groupSummary"></span><span class="operation-progress" id="operationProgress" aria-live="polite"></span><button class="btn danger" id="clearSelected" type="button">清空选中分组</button><button class="btn" id="createMissing" type="button">一键补齐</button><button class="btn primary" id="createSelected" type="button">为选中分组创建 Key</button></div>
  </section>
</div>
<div class="modal" id="mappingModal" role="dialog" aria-modal="true" aria-labelledby="mappingDialogTitle">
  <section class="dialog">
    <div class="dialog-head"><h2 id="mappingDialogTitle">分组路由映射</h2><button class="btn" id="closeMapping" type="button">关闭</button></div>
    <div class="group-table" id="mappingTable"><div class="empty">正在载入</div></div>
    <div class="dialog-actions"><span class="summary">自动能力是硬约束；手工模型和路径规则只会进一步收窄候选</span><button class="btn primary" id="saveGroupRules" type="button">保存映射</button></div>
  </section>
</div>
<div class="modal" id="experienceModal" role="dialog" aria-modal="true" aria-labelledby="experienceDialogTitle">
  <section class="dialog experience-dialog">
    <div class="dialog-head"><h2 id="experienceDialogTitle">外部数据源</h2><button class="btn" id="closeExperience" type="button">关闭</button></div>
    <details class="experience-config" id="experienceConfigPanel" open>
      <summary>接口与字段配置<span id="experienceConfigSummary">尚未配置</span></summary>
      <div class="experience-config-body">
        <div class="experience-section">
          <h3>接口请求</h3>
          <div class="experience-grid">
            <div class="field"><label for="experienceUrl">GET 接口 URL</label><input id="experienceUrl" type="url" placeholder="https://example.com/api/metrics"></div>
          </div>
          <div class="query-param-head"><span>查询参数（可选）</span><button class="btn" id="addExperienceQueryParam" type="button">添加参数</button></div>
          <div class="query-param-list" id="experienceQueryParams"></div>
        </div>
        <div class="experience-section">
          <h3>返回数据映射</h3>
          <div class="transform-grid">
            <div class="field"><label for="experienceItemsPath">记录列表路径</label><input id="experienceItemsPath" placeholder="例如 data.items；顶层数组填 $"></div>
            <div class="field"><label for="experienceIdPath">唯一标识字段</label><input id="experienceIdPath" placeholder="例如 id"></div>
            <div class="field"><label for="experienceTtftPath">延迟值字段</label><input id="experienceTtftPath" placeholder="例如 metrics.ttft"></div>
            <div class="field"><label for="experienceTtftUnit">延迟单位</label><select id="experienceTtftUnit"><option value="ms">毫秒</option><option value="s">秒</option></select></div>
            <div class="field"><label for="experienceNamePath">显示名称字段（可选）</label><input id="experienceNamePath" placeholder="例如 name"></div>
            <div class="field"><label for="experiencePlatformPath">分类字段（可选）</label><input id="experiencePlatformPath" placeholder="例如 provider"></div>
            <div class="field"><label for="experienceRatePath">成本或倍率字段（可选）</label><input id="experienceRatePath" placeholder="例如 rate"></div>
            <div class="field"><label for="experienceCountPath">样本数字段（可选）</label><input id="experienceCountPath" placeholder="例如 sample_count"></div>
            <div class="field"><label for="experienceTimePath">采集时间字段（可选）</label><input id="experienceTimePath" placeholder="例如 updated_at"></div>
          </div>
        </div>
        <div class="form-actions"><span class="experience-status" id="experienceStatus"></span><button class="btn danger" id="removeExperience" type="button">移除数据源</button><button class="btn primary" id="loadExperience" type="button">读取并保存</button></div>
      </div>
    </details>
    <div class="experience-mapping-head"><h3>分组映射</h3></div>
    <div class="group-table" id="experienceTable"><div class="empty">请先读取数据源</div></div>
    <div class="dialog-actions"><span class="summary" id="experienceSummary"></span><button class="btn" id="autoMatchExperience" type="button">自动匹配</button><button class="btn primary" id="saveExperienceMapping" type="button">保存映射</button></div>
  </section>
</div>
<div class="modal" id="manualEditModal" role="dialog" aria-modal="true" aria-labelledby="manualEditDialogTitle">
  <section class="dialog">
    <div class="dialog-head"><h2 id="manualEditDialogTitle">编辑 Key</h2><button class="btn" id="closeManualEdit" type="button">关闭</button></div>
    <form id="manualEditForm" class="manual-edit-body">
      <div class="form-grid">
        <div class="field"><label for="editLabel">标识</label><input id="editLabel" placeholder="选填，便于识别"></div>
        <div class="field"><label for="editSort">倍率</label><input id="editSort" placeholder="选填，数字"></div>
        <div class="field"><label for="editGroup">分组名</label><input id="editGroup" placeholder="选填"></div>
        <div class="field field--wide"><label for="editModels">模型规则</label><input id="editModels" placeholder="选填，分号分隔，如 gpt-4*;claude*"></div>
        <div class="field field--wide"><label for="editPaths">路径规则</label><input id="editPaths" placeholder="选填，分号分隔，如 v1/images/*;v1/chat/*"></div>
      </div>
    </form>
    <div class="dialog-actions"><button class="btn" type="button" id="cancelManualEdit">取消</button><button class="btn primary" type="submit" form="manualEditForm" id="manualEditSubmit">保存修改</button></div>
  </section>
</div>
<div class="modal" id="manualAddModal" role="dialog" aria-modal="true" aria-labelledby="manualAddDialogTitle">
  <section class="dialog">
    <div class="dialog-head"><h2 id="manualAddDialogTitle">添加 Key</h2><button class="btn" id="closeManualAdd" type="button">关闭</button></div>
    <form id="manualAddForm" class="manual-edit-body">
      <div class="form-grid">
        <div class="field field--wide"><label for="addKey">Key</label><input id="addKey" placeholder="必填" required></div>
        <div class="field"><label for="addLabel">标识</label><input id="addLabel" placeholder="选填，便于识别"></div>
        <div class="field"><label for="addSort">倍率</label><input id="addSort" placeholder="选填，数字"></div>
        <div class="field"><label for="addGroup">分组名</label><input id="addGroup" placeholder="选填"></div>
        <div class="field field--wide"><label for="addModels">模型规则</label><input id="addModels" placeholder="选填，分号分隔，如 gpt-4*;claude*"></div>
        <div class="field field--wide"><label for="addPaths">路径规则</label><input id="addPaths" placeholder="选填，分号分隔，如 v1/images/*;v1/chat/*"></div>
      </div>
    </form>
    <div class="dialog-actions"><button class="btn" type="button" id="cancelManualAdd">取消</button><button class="btn primary" type="submit" form="manualAddForm" id="manualAddSubmit">添加</button></div>
  </section>
</div>
<div class="experience-options" id="experienceOptions" role="listbox" hidden></div>
<script>
const $=id=>document.getElementById(id);let state={adapters:[],sources:[],defaults:{}},activeSource='',groupCatalog=[],keySortMode='default',keySortDirection=1,expandedSourceId=null,activeExperienceInput=null;const activeChecks=new Set(),activeGroupChecks=new Set(),groupCheckProgress=new Map(),policyDrafts=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notice(message,type='ok'){const el=$('notice');el.textContent=message;el.className='notice show '+type;clearTimeout(el.timer);el.timer=setTimeout(()=>el.className='notice',5000)}
function fmtTime(v){if(!v)return '尚未同步';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString()}

function fmtTok(v){const n=Number(v)||0;if(n>=1e6)return(n/1e6).toFixed(n>=1e7?1:2).replace(/\.0+$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(n>=1e4?1:2).replace(/\.0+$/,'')+'K';return String(n)}
async function api(path,options={}){const endpoint=new URL('/admin/key-pools/api/'+path,window.location.origin);const response=await fetch(endpoint.toString(),{headers:{'Content-Type':'application/json'},...options});let data={};try{data=await response.json()}catch{}if(!response.ok){const message=data.detail||data.message||('HTTP '+response.status);throw new Error(message==='invalid_admin_credentials'?'登录已失效，请重新登录':message)}return data}
function renderCredentialFields(){const adapter=state.adapters.find(a=>a.name===$('adapter').value);$('credentials').innerHTML=(adapter?.credential_fields||[]).map(field=>`<div class="field"><label for="cred_${esc(field.name)}">${esc(field.label)}</label><input id="cred_${esc(field.name)}" data-credential="${esc(field.name)}" type="${esc(field.type||'text')}" required autocomplete="${field.type==='password'?'current-password':'off'}"></div>`).join('')}
function configureForm(){const adapters=(state.adapters||[]).filter(a=>a.name!=='manual');$('adapter').innerHTML=adapters.map(a=>`<option value="${esc(a.name)}">${esc(a.label)}</option>`).join('');$('adapter').value=adapters.some(a=>a.name===state.defaults?.adapter)?state.defaults.adapter:(adapters[0]?.name||'');$('baseUrl').value='';$('routePrefix').value='';$('provider').value='';renderCredentialFields()}
function supports(source,capability){const adapter=state.adapters.find(a=>a.name===source.adapter);return(adapter?.capabilities||[]).includes(capability)}
function sortHead(label,mode,num=false){const active=keySortMode===mode;const arrow=active?(keySortDirection===1?'↑':'↓'):'↕';return `<th${num?' class="num"':''}><button type="button" class="sort-head${active?' active':''}" data-sort="${mode}">${label}<span class="sort-icon">${arrow}</span></button></th>`}
function capabilityParts(item){const c=item.routing_capabilities||{},parts=[];if((c.endpoint_families||[]).length)parts.push('端点: '+c.endpoint_families.join(', '));if((c.model_patterns||[]).length)parts.push('模型: '+c.model_patterns.join(', '));else if(c.model_list_known)parts.push('模型: 无');if((c.model_scopes||[]).length)parts.push('范围: '+c.model_scopes.join(', '));return parts}
function capabilityText(item){return capabilityParts(item).join('; ')}
function isImageModel(model){const value=String(model||'').toLowerCase().split('/').pop();if(/embed/.test(value))return false;return /(?:^|[-_.])(?:image|imagen|nano-banana|dall-e|dalle|flux|seedream|recraft|ideogram|stable-image|stable-diffusion|sdxl)(?=$|[-_.]|\d)/.test(value)}
function rejectedRoutes(c,model){const normalized=String(model).toLowerCase();return Object.entries(c.rejected_model_routes||{}).filter(([,models])=>(models||[]).some(value=>String(value).toLowerCase()===normalized)).map(([route])=>route)}
function modelCapabilityMarkup(c,model){const normalized=String(model).toLowerCase(),globalRejected=(c.rejected_models||[]).some(value=>String(value).toLowerCase()===normalized),routes=rejectedRoutes(c,model),imagePermissionKnown=Object.prototype.hasOwnProperty.call(c,'image_generation'),noPermission=isImageModel(model)&&imagePermissionKnown&&!c.image_generation,disabled=globalRejected||noPermission,reason=globalRejected?'检测已确认该分组不支持此模型':noPermission?'分组未开启生图权限':'',routeItems=routes.map(route=>`<span class="rejected-route" title="检测已确认 ${esc(route)} 端点不支持此模型">${esc(route)} 不可用</span>`).join('');return `<span class="${disabled?'rejected-model':''}"${reason?` title="${reason}"`:''}>${esc(model)}</span>${routeItems}`}
function capabilityMarkup(item){const c=item.routing_capabilities||{},parts=[],listedModels=c.model_patterns||[],routeRejected=Object.values(c.rejected_model_routes||{}).flat(),rejectedModels=[...(c.rejected_models||[]),...routeRejected],listedNames=new Set(listedModels.map(model=>String(model).toLowerCase())),learnedOnly=rejectedModels.filter((model,index,models)=>{const normalized=String(model).toLowerCase();return!listedNames.has(normalized)&&models.findIndex(value=>String(value).toLowerCase()===normalized)===index}),modelItems=listedModels.map(model=>modelCapabilityMarkup(c,model)).concat(learnedOnly.map(model=>modelCapabilityMarkup(c,model)));if((c.endpoint_families||[]).length)parts.push(`<div>端点: ${esc(c.endpoint_families.join(', '))}</div>`);if(modelItems.length)parts.push(`<div>模型: ${modelItems.join(', ')}</div>`);else if(c.model_list_known)parts.push('<div>模型: 无</div>');if((c.model_scopes||[]).length)parts.push(`<div>范围: ${esc(c.model_scopes.join(', '))}</div>`);return parts.length?parts.join(''):'-'}
function latencyMarkup(k){const real=k.ttft_ewma==null?'-':Number(k.ttft_ewma).toFixed(2)+' s',probe=k.probe_latency_s==null?'-':Number(k.probe_latency_s).toFixed(2)+' s',prior=k.experience_ttft_s==null?'':`<div class="state-detail" title="外部数据 ${k.experience_samples||0} 个样本，最近 ${esc(fmtEpoch(k.experience_last_ts))}">外部参考 ${Number(k.experience_ttft_s).toFixed(2)} s</div>`;return `<div title="真实请求 ${k.ttft_samples||0} 个样本，最近 ${esc(fmtEpoch(k.ttft_last_ts))}"><strong>真实 ${real}</strong>${k.ttft_stale?' <span class="pill warn">旧</span>':''}</div>${prior}<div class="state-detail" title="最近检测 ${esc(fmtEpoch(k.probe_last_ts))}">检测响应 ${probe}</div>`}
function cacheMarkup(k){if(k.cache_hit_rate==null)return '-';return `<div title="缓存 ${k.cache_cached_tokens||0} / 输入 ${k.cache_input_tokens||0} Token，最近 ${esc(fmtEpoch(k.cache_last_ts))}"><strong>${(Number(k.cache_hit_rate)*100).toFixed(1)}%</strong><span class="state-detail">${k.cache_samples||0} 次 · ${fmtTok(k.cache_cached_tokens)} / ${fmtTok(k.cache_input_tokens)}</span></div>`}
function keyRows(keys,sourceId,isManual=false){
  if(!keys.length)return `<tr><td colspan="${isManual?7:11}" style="text-align:center;color:var(--muted);padding:28px">暂无 Key</td></tr>`;
  const ordered=[...keys],renderedCheckGroups=new Set();
  ordered.sort((a,b)=>{const tie=()=>String(a.group_name||'').localeCompare(String(b.group_name||''),'zh-CN')||String(a.label||'').localeCompare(String(b.label||''),'zh-CN');if(keySortMode==='group')return tie()*keySortDirection;if(keySortMode==='rate'){const ar=Number.parseFloat(a.sort),br=Number.parseFloat(b.sort),av=Number.isFinite(ar)?ar:Number.POSITIVE_INFINITY,bv=Number.isFinite(br)?br:Number.POSITIVE_INFINITY;return(av-bv||tie())*keySortDirection}if(keySortMode==='latency'||keySortMode==='cache'){const field=keySortMode==='latency'?'ttft_ewma':'cache_hit_rate',av=a[field],bv=b[field],ak=av!=null&&Number.isFinite(Number(av)),bk=bv!=null&&Number.isFinite(Number(bv));if(!ak&&!bk)return tie();if(!ak)return 1;if(!bk)return-1;return((Number(av)-Number(bv))*keySortDirection)||tie()}return 0});
  return ordered.map(k=>{
    const automatic=capabilityText(k),rules=[...(k.models||[]),...(k.paths||[])].join('; '),minutes=Math.max(1,Math.ceil((k.cooldown_remaining||0)/60));
    let status,actions;if(!k.enabled){status='已停用';actions=`<button class="text-action" type="button" data-key-state="1" data-source-key-id="${esc(k.source_key_id)}" data-source-id="${esc(sourceId)}">启用</button>`}else if(k.cooled){const circuitLabel=k.last_failure_kind==='probe'?'检测熔断':k.last_failure_kind==='cache_miss'?'缓存熔断':'熔断';status=`<span title="最近失败 ${esc(k.last_failure_status||k.last_failure_kind||'-')}，剩余约 ${minutes} 分钟">${circuitLabel}</span>`;actions=`<button class="text-action" type="button" data-reset-group="${esc(k.group_id||k.source_key_id)}" data-source-id="${esc(sourceId)}">解除熔断</button><button class="text-action danger" type="button" data-key-state="0" data-source-key-id="${esc(k.source_key_id)}" data-source-id="${esc(sourceId)}">停用</button>`}else{status='可用';actions=`<button class="text-action danger" type="button" data-key-state="0" data-source-key-id="${esc(k.source_key_id)}" data-source-id="${esc(sourceId)}">停用</button>`}const groupId=String(k.group_id||''),showGroupCheck=!isManual&&groupId&&!renderedCheckGroups.has(groupId);if(showGroupCheck){renderedCheckGroups.add(groupId);const checkKey=groupCheckKey(sourceId,groupId),running=activeGroupChecks.has(checkKey),progress=groupCheckProgress.get(checkKey);actions=`<button class="text-action" type="button" data-action="check-group" data-source-id="${esc(sourceId)}" data-group-id="${esc(groupId)}" data-group-name="${esc(k.group_name||k.label)}" ${running?'disabled':''}>${running?`检测中 ${progress?.done||0}/${progress?.total||'?'}`:'检测可用模型'}</button>`+actions}

$('content').addEventListener('click',async e=>{const button=e.target.closest('[data-action="check"]');if(!button)return;const sourceId=button.dataset.id,source=button.closest('.source'),model=source.querySelector('[data-check-model]')?.value.trim();if(!model){notice('请先填写检测模型','error');return}const localSource=(state.sources||[]).find(item=>item.id===sourceId);if(localSource)localSource.check_model=model;activeChecks.add(sourceId);render();const request=api('check',{method:'POST',body:JSON.stringify({source_id:sourceId,model})}),poll=pollCheck(request);try{const result=await request;await poll;state=result.state;const checks=result.checks||[],cooled=checks.filter(item=>item.circuit_opened).length,rejected=checks.filter(item=>item.available===false&&!item.circuit_opened).length;if(cooled)notice(`${result.model} 检测完成，熔断 ${cooled} 个运行故障分组${rejected?`，另有 ${rejected} 个分组不支持该请求`:''}`,'error');else if(rejected)notice(`${result.model} 检测完成，${rejected} 个分组不支持该模型或请求，未触发熔断`,'warn');else notice(`${result.model} 检测完成，所有分组可用`,'ok')}catch(err){await poll;notice(err.message,'error')}finally{activeChecks.delete(sourceId);render()}});
function groupModels(sourceId,groupId){const source=(state.sources||[]).find(item=>String(item.id)===String(sourceId)),models=[],append=caps=>models.push(...(caps.model_patterns||[]),...(caps.rejected_models||[]),...Object.values(caps.rejected_model_routes||{}).flat());for(const key of source?.keys||[]){if(String(key.group_id||'')!==String(groupId))continue;append(key.routing_capabilities||{})}for(const group of groupCatalog){if(String(group.id)===String(groupId))append(group.routing_capabilities||{})}return [...new Set(models.map(model=>String(model).trim()).filter(model=>model&&!/[?*\[\]]/.test(model)))].sort((a,b)=>a.localeCompare(b))}
async function checkGroupModels(sourceId,groupId,groupName='',models=null){const checkKey=groupCheckKey(sourceId,groupId),targetModels=models||groupModels(sourceId,groupId);if(!targetModels.length){notice(`${groupName||groupId} 没有可检测的具体模型`,'warn');return}activeGroupChecks.add(checkKey);groupCheckProgress.set(checkKey,{done:0,total:targetModels.length});render();if($('groupModal').classList.contains('open'))renderGroups();let available=0,rejected=0,inconclusive=0;try{for(const model of targetModels){const result=await api('check',{method:'POST',body:JSON.stringify({source_id:sourceId,model,group_ids:[groupId],persist_model:false})}),check=result.checks?.[0];state=result.state;if(check?.available)available++;else if(check?.reason==='model_unsupported')rejected++;else inconclusive++;const progress=groupCheckProgress.get(checkKey);if(progress)progress.done++;render()}notice(`${groupName||groupId} 模型检测完成：可用 ${available}，不支持 ${rejected}，待确认 ${inconclusive}`,'ok');if($('groupModal').classList.contains('open')){const catalog=await api('catalog?source_id='+encodeURIComponent(sourceId));groupCatalog=catalog.groups||[]}render()}catch(err){notice(err.message,'error')}finally{activeGroupChecks.delete(checkKey);groupCheckProgress.delete(checkKey);render();if($('groupModal').classList.contains('open'))renderGroups()}}
$('content').addEventListener('click',e=>{const button=e.target.closest('[data-action="check-group"]');if(button)checkGroupModels(button.dataset.sourceId,button.dataset.groupId,button.dataset.groupName)});
$('groupTable').addEventListener('click',e=>{const button=e.target.closest('[data-action="check-group"]');if(!button)return;const group=groupCatalog.find(item=>String(item.id)===String(button.dataset.groupId));checkGroupModels(button.dataset.sourceId,button.dataset.groupId,group?.name||'')});

$('manualEditForm').addEventListener('submit',async e=>{e.preventDefault();const modal=$('manualEditModal'),button=$('manualEditSubmit');const sourceId=modal.dataset.sourceId,sourceKeyId=modal.dataset.sourceKeyId;if(!sourceId||!sourceKeyId){notice('未找到要编辑的 Key','error');return}button.disabled=true;const group=$('editGroup').value.trim();try{state=await api('manual-update',{method:'POST',body:JSON.stringify({source_id:sourceId,source_key_id:sourceKeyId,label:$('editLabel').value.trim(),sort:$('editSort').value.trim(),group_id:group,group_name:group,models:$('editModels').value.trim(),paths:$('editPaths').value.trim()})});modal.classList.remove('open');render();notice('Key 已更新')}catch(err){notice(err.message,'error')}finally{button.disabled=false}});

$('experienceTable').addEventListener('keydown',e=>{if(!e.target.matches('[data-experience-local]'))return;if(e.key==='Escape'){closeExperienceOptions();return}if($('experienceOptions').hidden)openExperienceOptions(e.target);const options=[...$('experienceOptions').querySelectorAll('[data-experience-option]')],active=options.findIndex(option=>option.classList.contains('active'));if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const start=active<0?(e.key==='ArrowDown'?-1:0):active,next=options[(start+(e.key==='ArrowDown'?1:-1)+options.length)%options.length];if(next){options.forEach(option=>{const highlighted=option===next;option.classList.toggle('active',highlighted);option.setAttribute('aria-selected',String(highlighted))});next.scrollIntoView({block:'nearest'})}}else if(e.key==='Enter'&&active>=0){e.preventDefault();options[active].click()}});
