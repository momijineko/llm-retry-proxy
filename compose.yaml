services:
  llm-retry-proxy:
    build:
      context: .
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.io}"
        PYTHON_BASE_IMAGE: "${PYTHON_BASE_IMAGE:-library/python:3.12-slim}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    container_name: llm-retry-proxy
    command: ["python", "/app/main.py"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LISTEN_HOST: 0.0.0.0
      KEY_POOL_FILE: "${KEY_POOL_FILE-/app/key_pool.csv}"
      LOG_DIR: /app/logs
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "${LISTEN_PORT:-8080}:${LISTEN_PORT:-8080}"
    volumes:
      - ./key_pool.csv:/app/key_pool.csv:ro
      - ./logs:/app/logs
      # 挂载宿主机 .env 供配置中心读写：/settings 保存的"重启后生效"项
      # 直接持久化到宿主机文件，重启/重建容器后经 env_file 重新注入生效
      - ./.env:/app/.env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('LISTEN_PORT','8080')+'/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
